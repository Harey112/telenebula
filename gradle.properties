# Sized for a 4 GB build host: one Gradle JVM, one Kotlin daemon, two workers. Raise on bigger machines.
# 2 GB is the floor since :dex and :web joined: lint's Play SDK index parse runs out of heap under it.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
