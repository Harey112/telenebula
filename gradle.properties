# Sized for a 4 GB build host: one Gradle JVM, one Kotlin daemon, two workers. Raise on bigger machines.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
