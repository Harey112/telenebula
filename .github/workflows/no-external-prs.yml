name: no external pull requests

# The project is published as source but takes no contributions. Interaction limits already
# stop strangers from opening pull requests; they expire twice a year, and this does not.
# pull_request_target runs with the base repository's token and never checks out the fork.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --comment "Thanks for the interest. TeleNebula is published as source but does not accept pull requests; please use the releases, and fork freely under the license." \
            --delete-branch=false
